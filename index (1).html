<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Weaver - AI Short Story Generator</title>
    <meta name="description" content="Generate highly creative short stories using Google Gemini API.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <!-- Setup Screen -->
        <main id="setup-screen" class="glass-card active">
            <header>
                <h1>Story Weaver</h1>
                <p>Spin a tale from thin air.</p>
            </header>

            <form id="generate-form">

                <div class="input-group">
                    <label for="genre">Genre</label>
                    <select id="genre" required>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Horror">Horror</option>
                        <option value="Romance">Romance</option>
                        <option value="Historical Fiction">Historical Fiction</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="keywords">Keywords</label>
                    <input type="text" id="keywords" placeholder="e.g. ancient clock, time travel, betrayer" required>
                </div>

                <button type="submit" id="generate-btn">
                    <span class="btn-text">Generate Story</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>
            <div id="error-message" class="error hidden"></div>
        </main>

        <!-- Reading Screen -->
        <article id="reading-screen" class="hidden">
            <nav class="reading-nav">
                <button id="back-btn" class="icon-btn" title="Back to menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div class="controls">
                    <button id="decrease-font" class="icon-btn" title="Decrease font size">A-</button>
                    <button id="increase-font" class="icon-btn" title="Increase font size">A+</button>
                </div>
            </nav>

            <div class="story-content">
                <h1 id="story-title">The Tale Unfolds</h1>
                <div id="story-body"></div>
            </div>
        </article>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
